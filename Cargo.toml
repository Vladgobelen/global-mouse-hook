[package]
name = "global-mouse-hook"
version = "0.1.0"
edition = "2021"

# 🔧 Собираем исполняемый файл, а не .node библиотеку
[[bin]]
name = "global-mouse-hook"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 🔧 Windows API только для Windows-таргетов
[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Console"
]}

[profile.release]
opt-level = "z"
lto = true
strip = true