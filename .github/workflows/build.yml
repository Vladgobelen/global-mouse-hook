name: Build Native Hook

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Windows Binary
        run: |
          # Безопасно переходим в папку модуля (используем bash, чтобы избежать проблем с путями в PowerShell)
          cd global-mouse-hook
          cargo build --release
        shell: bash

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: global-mouse-hook-win64
          path: global-mouse-hook/target/release/global-mouse-hook.exe
          retention-days: 14