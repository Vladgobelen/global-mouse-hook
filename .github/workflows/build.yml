name: Build Windows Release
on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Build Rust Binary
        run: cargo build --release

      - name: Verify binary
        run: |
          $binary = "target/release/global-mouse-hook.exe"
          if (-not (Test-Path $binary)) {
            Write-Error "❌ Failed to build global-mouse-hook.exe"
            exit 1
          }
          Write-Host "✅ Successfully built: $binary"
          
          # Если Electron ожидает бинарник в корне проекта, раскомментируйте следующую строку:
          # Copy-Item $binary -Destination "."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Electron App (Windows Portable)
        run: npm run build:win64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        if: success() && !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: NSQCuE-Win64-Portable
          path: dist/*.exe
          retention-days: 14

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
          draft: false