build-win:
  runs-on: windows-latest
  steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '18'
    - run: npm install
    - run: npx napi build --platform --release
    - uses: actions/upload-artifact@v4  # ← Обновленная версия
      with:
        name: global-mouse-hook-win32-x64
        path: global-mouse-hook.win32-x64-msvc.node
        retention-days: 7  # Опционально: хранить артефакт 7 дней